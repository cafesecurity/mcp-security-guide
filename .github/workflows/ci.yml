name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guide:
    name: Guide checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Internal links and anchors resolve
        run: python3 scripts/check_links.py
      - name: Checklists match the guide pages
        run: python3 scripts/build_checklists.py --check

  skills:
    name: Skills
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: SKILL.md format (agentskills.io)
        run: python3 scripts/check_skills.py
      - name: Docker version
        run: docker version --format 'client {{.Client.Version}} server {{.Server.Version}}'
      - name: Scanner, probe and sandbox tests (the sandbox runs the malicious fixture in Docker)
        env:
          AUDIT_SANDBOX_TEST: "1"
        run: python3 -m unittest discover -s skills/tests -v

  example:
    name: Ask Trevor example
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/ask-trevor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - name: Tests (auth, isolation, schemas, hostile content, transport, snapshot, operations)
        run: npm test
      - name: Tool definitions unchanged, or changed with review
        run: npm run snapshot:check
      - name: Dependency audit
        run: npm audit --audit-level=high
